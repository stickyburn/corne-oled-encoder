# Left half: central, display and USB Studio.
CONFIG_ZMK_KEYBOARD_NAME="Corne Choc BT"

# Idle and sleep after ten minutes.
CONFIG_ZMK_IDLE_TIMEOUT=600000
CONFIG_ZMK_SLEEP=y
CONFIG_ZMK_IDLE_SLEEP_TIMEOUT=600000

CONFIG_ZMK_DISPLAY=y
CONFIG_ZMK_DISPLAY_WORK_QUEUE_DEDICATED=y
CONFIG_ZMK_DISPLAY_BLANK_ON_IDLE=n

# Local static spacetime screen; keep the vendor's display hardware support.
CONFIG_ZMK_DISPLAY_STATUS_SCREEN_CUSTOM=y
CONFIG_SHARP_MIP_WIDGET_STATUS=n
CONFIG_LV_USE_IMG=y
CONFIG_LV_USE_CANVAS=y
CONFIG_ZMK_WPM=y

# Rainbow swirl by default; saved RGB settings take precedence.
CONFIG_ZMK_RGB_UNDERGLOW=y
CONFIG_ZMK_RGB_UNDERGLOW_ON_START=y
CONFIG_ZMK_RGB_UNDERGLOW_EFF_START=3
CONFIG_ZMK_RGB_UNDERGLOW_HUE_START=200
CONFIG_ZMK_RGB_UNDERGLOW_AUTO_OFF_IDLE=y

CONFIG_ZMK_RGB_UNDERGLOW_BRT_MAX=40
