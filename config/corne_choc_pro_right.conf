# Corne Choc Pro BT - right half (peripheral side).
#
# This file is deliberately complete and duplicated with
# corne_choc_pro_left.conf: ZMK merges every <board>.conf it finds in the
# config directory, so each half carries its own full configuration instead
# of relying on a shared file.

# Keyboard name shown to USB and Bluetooth hosts (max. 16 characters).
CONFIG_ZMK_KEYBOARD_NAME="Corne Choc BT"

# Enter idle after five minutes; deep sleep after 30 minutes of inactivity.
CONFIG_ZMK_IDLE_TIMEOUT=300000
CONFIG_ZMK_SLEEP=y
CONFIG_ZMK_IDLE_SLEEP_TIMEOUT=1800000

# No display is fitted on this half (and its build ships without the
# sharp_mip shield), so keep the display stack compiled out.
CONFIG_ZMK_DISPLAY=n

# RGB starts on with rainbow swirl (effect 3); turn off while idle.
# Previously saved RGB settings can override these startup defaults.
CONFIG_ZMK_RGB_UNDERGLOW=y
CONFIG_ZMK_RGB_UNDERGLOW_ON_START=y
CONFIG_ZMK_RGB_UNDERGLOW_EFF_START=3
CONFIG_ZMK_RGB_UNDERGLOW_HUE_START=200
CONFIG_ZMK_RGB_UNDERGLOW_AUTO_OFF_IDLE=y

# Conservative maximum brightness, matching the vendor board default.
CONFIG_ZMK_RGB_UNDERGLOW_BRT_MAX=30
