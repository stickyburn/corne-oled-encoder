# Build matrix consumed by the zmkfirmware reusable workflow
# (.github/workflows/build-user-config.yml).
#
# Four jobs:
#
#   - normal firmware for the left half (central): Sharp MIP display shield
#     plus ZMK Studio over USB
#   - normal firmware for the right half (peripheral): no display fitted on
#     this half, so no shield, no snippet and no Studio
#   - settings_reset firmware for both halves, built against config/reset so
#     the display/Studio configuration stays out of the reset firmware
#
# Available matrix properties: board, shield, cmake-args, snippet,
# artifact-name.
---
include:
  # Normal firmware, left half (central): display + ZMK Studio.
  - board: corne_choc_pro_left
    shield: sharp_mip
    snippet: studio-rpc-usb-uart
    cmake-args: -DCONFIG_ZMK_STUDIO=y
    artifact-name: corne-oled-encoder-left
  # Normal firmware, right half (peripheral): no display, no Studio.
  - board: corne_choc_pro_right
    artifact-name: corne-oled-encoder-right
  # Settings reset, left half: minimal config, no display, no Studio.
  - board: corne_choc_pro_left
    shield: settings_reset
    cmake-args: -DZMK_CONFIG=${GITHUB_WORKSPACE}/config/reset -DCONFIG_ZMK_STUDIO=n
    artifact-name: settings-reset-left
  # Settings reset, right half: minimal config, no display, no Studio.
  - board: corne_choc_pro_right
    shield: settings_reset
    cmake-args: -DZMK_CONFIG=${GITHUB_WORKSPACE}/config/reset -DCONFIG_ZMK_STUDIO=n
    artifact-name: settings-reset-right
