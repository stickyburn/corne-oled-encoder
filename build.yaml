include:
  - board: corne_choc_pro_left
    shield: sharp_mip
    snippet: studio-rpc-usb-uart
    cmake-args: -DCONFIG_ZMK_STUDIO=y
    artifact-name: corne-oled-encoder-left
  - board: corne_choc_pro_right
    artifact-name: corne-oled-encoder-right
  # Keep display/Studio settings out of recovery firmware.
  - board: corne_choc_pro_left
    shield: settings_reset
    cmake-args: -DZMK_CONFIG=${GITHUB_WORKSPACE}/config/reset -DCONFIG_ZMK_STUDIO=n
    artifact-name: settings-reset-left
  - board: corne_choc_pro_right
    shield: settings_reset
    cmake-args: -DZMK_CONFIG=${GITHUB_WORKSPACE}/config/reset -DCONFIG_ZMK_STUDIO=n
    artifact-name: settings-reset-right
